packages:
  - apps/*
  - packages/*
minimumReleaseAgeStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Registry security release; the local patch also closes its reproduced stale bypass.
  - http-cache-semantics@4.3.0
  # Expo's current SDK 57 compatibility cohort, verified against its npm releases.
  - expo@57.0.26
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo-document-picker@57.0.3
  # Match the AI SDK and workflow cohort supported by the installed Eve release.
  - "@ai-sdk/*"
  - ai
  - "@vercel/*"
  - "@onkernel/*"
  - eve
  - "@workflow/*"
  # These browser and rendering transitive releases are locked by the current Eve UI scaffold.
  - baseline-browser-mapping
  - caniuse-lite
  - electron-to-chromium
  - mermaid
  - picomatch
  - systeminformation
allowBuilds:
  "@google/genai": false
  "@mongodb-js/zstd": false
  cbor-extract: false
  core-js: false
  esbuild: true
  electron: true
  electron-winstaller: false
  msgpackr-extract: false
  node-liblzma: false
  protobufjs: false
  sharp: true
overrides:
  # Keep Malloy's schema adapter on the application's qualified current pg driver.
  "@malloydata/db-postgres>pg": 8.23.0
  # TenTap's native host shares Expo's React 19 renderer; its bundled WebView is isolated.
  "@10play/tentap-editor>react-dom": 19.2.3
  # xcode only uses uuid.v4(); 11 is the patched CommonJS-compatible release.
  "xcode>uuid": 11.1.1
  # Security fixes within the existing parser majors.
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "qs@<6.16.0": 6.16.0
  "http-cache-semantics@>=4.0.0 <4.3.0": 4.3.0
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  "ip-address@>=10.0.0 <10.7.2": 10.7.2
  "undici@>=6.0.0 <6.29.0": 6.29.0
  "undici@>=7.0.0 <7.30.0": 7.30.0
  "undici@>=8.0.0 <8.11.2": 8.11.2
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  # The vulnerable 4.x line is patched only in 5; its require export remains compatible.
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  # Drizzle's legacy loader only uses transform; do not retain its vulnerable dev server.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
patchedDependencies:
  http-cache-semantics@4.3.0: patches/http-cache-semantics@4.3.0.patch
  "@10play/tentap-editor@1.0.1": patches/@10play__tentap-editor@1.0.1.patch
  "@linqapp/chat-sdk-adapter@0.5.1": patches/@linqapp__chat-sdk-adapter@0.5.1.patch
  "@workflow/world-postgres@5.0.0-beta.44": patches/@workflow__world-postgres@5.0.0-beta.44.patch
  eve@0.63.0: patches/eve@0.63.0.patch
