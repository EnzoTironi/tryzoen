minimumReleaseAgeStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Match the AI SDK and workflow cohort supported by the installed Eve release.
  - "@ai-sdk/*"
  - ai
  - "@vercel/*"
  - "@onkernel/*"
  - eve
  - "@workflow/*"
  # These browser and rendering transitive releases are locked by the current Eve UI scaffold.
  - baseline-browser-mapping
  - caniuse-lite
  - electron-to-chromium
  - mermaid
  - picomatch
  - systeminformation
allowBuilds:
  "@google/genai": false
  "@mongodb-js/zstd": false
  cbor-extract: false
  core-js: false
  esbuild: true
  msgpackr-extract: false
  node-liblzma: false
  protobufjs: false
  sharp: true
overrides:
  # Security fixes within the existing parser majors.
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "qs@<6.16.0": 6.16.0
  # Drizzle's legacy loader only uses transform; do not retain its vulnerable dev server.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
patchedDependencies:
  "@linqapp/chat-sdk-adapter@0.5.1": patches/@linqapp__chat-sdk-adapter@0.5.1.patch
  "@workflow/world-postgres@5.0.0-beta.44": patches/@workflow__world-postgres@5.0.0-beta.44.patch
  eve@0.63.0: patches/eve@0.63.0.patch
