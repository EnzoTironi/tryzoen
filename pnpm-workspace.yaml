packages:
  - "."
  - "packages/operon"

minimumReleaseAgeStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Eve 0.44.4's current official scaffold resolves the matching AI SDK release cohort.
  - "@ai-sdk/*"
  - ai
  - "@vercel/*"
  - "@onkernel/*"
  - eve
  # These browser and rendering transitive releases are locked by the current Eve UI scaffold.
  - baseline-browser-mapping
  - caniuse-lite
  - electron-to-chromium
  - mermaid
  - picomatch
  - systeminformation
allowBuilds:
  "@google/genai": false
  "@mongodb-js/zstd": false
  cbor-extract: false
  esbuild: true
  msgpackr-extract: false
  node-liblzma: false
  protobufjs: false
  sharp: true
overrides:
  # Security fixes within the existing parser majors.
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "qs@<6.16.0": 6.16.0
  # Drizzle's legacy loader only uses transform; do not retain its vulnerable dev server.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
patchedDependencies:
  "@linqapp/chat-sdk-adapter@0.5.1": patches/@linqapp__chat-sdk-adapter@0.5.1.patch
  "@workflow/world-postgres@5.0.0-beta.39": patches/@workflow__world-postgres@5.0.0-beta.39.patch
  "@workflow/world@5.0.0-beta.32": patches/@workflow__world@5.0.0-beta.32.patch
  # URL dependencies are patched by name; package.json pins the immutable source SHA.
  eve: patches/eve@0.52.2+main.59ec96cc99f65a80.patch
