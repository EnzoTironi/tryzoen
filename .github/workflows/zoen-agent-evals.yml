name: Zoen native agent evals

# Each manual dispatch needs a fresh dedicated Codex login in ZOEN_EVAL_PROVIDERS.
# Never reuse a desktop/production refresh grant; this ephemeral job discards its grant.
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Independent repetitions of the launch suite
        type: choice
        options: ["1", "3", "5"]
        default: "3"

concurrency:
  group: zoen-native-agent-evals
  cancel-in-progress: false

jobs:
  launch:
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: companion_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zoen_app:eval-runtime-password@127.0.0.1:5432/companion_runtime_test
      DATABASE_URL_UNPOOLED: postgresql://zoen_app:eval-runtime-password@127.0.0.1:5432/companion_runtime_test
      BETTER_AUTH_URL: http://127.0.0.1:4351
      COMPANION_PUBLIC_BASE_URL: http://127.0.0.1:4351
      COMPANION_MODEL_PROVIDER: codex-local
      COMPANION_CODEX_MODEL: gpt-5.6-luna
      COMPANION_BROWSER_MODEL_PROVIDER: codex-local
      COMPANION_BROWSER_MODEL: gpt-5.6-luna
      WORKFLOW_LOCAL_BASE_URL: http://127.0.0.1:4352
      EVE_NEXT_PRODUCTION_PORT: "4352"
      WORKFLOW_POSTGRES_WORKER_CONCURRENCY: "3"
      WORKFLOW_POSTGRES_MAX_POOL_SIZE: "6"
      ZOEN_MATRIX_URL: http://127.0.0.1:8008
      ZOEN_MATRIX_SERVER_NAME: matrix.zoen.test
      ZOEN_MATRIX_AS_TOKEN: synthetic-native-matrix-appservice-token-2026
      ZOEN_MATRIX_HS_TOKEN: synthetic-native-matrix-homeserver-token-2026
      CODEX_HOME: /tmp/zoen-eval-codex
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the native ChatGPT credential owner
        run: npm install --global @openai/codex@0.155.1 && codex --version
      - name: Prepare isolated database roles and migrations
        env:
          DATABASE_URL_UNPOOLED: postgresql://zoen_migrator:eval-migration-password@127.0.0.1:5432/companion_runtime_test
        run: |
          bootstrap() {
            docker exec -i \
              -e ZOEN_APPLICATION_DATABASE_PASSWORD=eval-runtime-password \
              -e ZOEN_MIGRATION_DATABASE_PASSWORD=eval-migration-password \
              '${{ job.services.postgres.id }}' bash < infrastructure/postgres/bootstrap-application.sh
          }
          bootstrap
          node --import tsx scripts/migrate-hosted.ts
          bootstrap
          docker exec -i -e ZOEN_VAULTWARDEN_DATABASE_PASSWORD=eval-vault-password \
            '${{ job.services.postgres.id }}' bash < infrastructure/postgres/bootstrap-vaultwarden.sh
          docker exec -i -e ZOEN_WHATSAPP_DATABASE_PASSWORD=eval-whatsapp-password \
            '${{ job.services.postgres.id }}' bash < infrastructure/postgres/bootstrap-whatsapp.sh
      - name: Start the isolated Matrix homeserver
        run: |
          docker exec -i -e ZOEN_MATRIX_DATABASE_PASSWORD=eval-matrix-password \
            '${{ job.services.postgres.id }}' bash < infrastructure/postgres/bootstrap-matrix.sh
          docker build -t zoen-matrix-eval infrastructure/matrix
          docker run -d --name matrix-eval --network host \
            -e ZOEN_MATRIX_SERVER_NAME -e ZOEN_MATRIX_AS_TOKEN -e ZOEN_MATRIX_HS_TOKEN \
            -e ZOEN_MATRIX_SIGNING_SECRET=synthetic-native-matrix-signing-secret-2026 \
            -e ZOEN_MATRIX_DATABASE_PASSWORD=eval-matrix-password \
            -e ZOEN_DATABASE_HOST=127.0.0.1 \
            -e ZOEN_MATRIX_CALLBACK_URL=http://127.0.0.1:4352 zoen-matrix-eval
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8008/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8008/health
      - name: Prepare the dedicated evaluation login and browser credentials
        env:
          EVAL_PROVIDERS: ${{ secrets.ZOEN_EVAL_PROVIDERS }}
        run: |
          umask 077
          mkdir -p .eve
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';
          import { parseEnv } from 'node:util';
          const source = parseEnv(process.env.EVAL_PROVIDERS ?? '');
          const mask = value => {
            if (typeof value === 'string' && value.length >= 8) {
              console.log('::add-mask::' + value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
              try { const nested = JSON.parse(value); if (nested && typeof nested === 'object') mask(nested); } catch {}
            } else if (value && typeof value === 'object') {
              Object.values(value).forEach(mask);
            }
          };
          mask(source);
          const selected = {};
          for (const name of ['CODEX_AUTH_JSON', 'KERNEL_API_KEY']) {
            if (!source[name]) throw new Error(`Missing eval provider: ${name}`);
            selected[name] = source[name];
          }
          selected.BETTER_AUTH_SECRET = randomBytes(32).toString('hex');
          selected.SECRET_ENCRYPTION_KEY = randomBytes(32).toString('base64');
          mask(selected);
          const authDirectory = process.env.CODEX_HOME;
          if (!authDirectory) throw new Error('The isolated Codex credential directory is missing');
          mkdirSync(authDirectory, { recursive: true, mode: 0o700 });
          execFileSync('sh', ['scripts/seed-credential.sh', join(authDirectory, 'auth.json')], {
            input: selected.CODEX_AUTH_JSON,
            stdio: ['pipe', 'ignore', 'pipe'],
          });
          writeFileSync(join(authDirectory, 'config.toml'), 'cli_auth_credentials_store = "file"\n', { mode: 0o600 });
          delete selected.CODEX_AUTH_JSON;
          const lines = Object.entries(selected).map(([key, value]) => {
            const quote = ['"', "'", '`'].find(candidate => !value.includes(candidate));
            if (!quote) throw new Error(`Cannot encode eval provider: ${key}`);
            return `${key}=${quote}${value}${quote}`;
          });
          const encoded = lines.join('\n') + '\n';
          const decoded = parseEnv(encoded);
          for (const [key, value] of Object.entries(selected)) {
            if (decoded[key] !== value) throw new Error(`Eval provider round-trip failed: ${key}`);
          }
          writeFileSync('.eve/eval.env', encoded, { mode: 0o600 });
          JS
          codex login status >/dev/null 2>&1 || { echo 'Native Codex login is unavailable'; exit 1; }
      - name: Build and evaluate the native agent
        env:
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          node --env-file=.eve/eval.env -e 'const {spawnSync}=require("node:child_process");process.exit(spawnSync("pnpm",["build","--force"],{stdio:"inherit",env:process.env}).status ?? 1)'
          node --env-file=.eve/eval.env --import tsx scripts/start.ts --port 4351 --eve-port 4352 > .eve/agent-server.log 2>&1 &
          app_pid=$!
          trap 'kill -TERM "$app_pid" 2>/dev/null || true; wait "$app_pid" || true; rm -f .eve/eval.env' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4351/eve/v1/health; then break; fi
            if ! kill -0 "$app_pid"; then
              tail -n 60 .eve/agent-server.log
              exit 1
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:4351/eve/v1/health; then
            tail -n 60 .eve/agent-server.log
            exit 1
          fi
          node --env-file=.eve/eval.env --import tsx scripts/run-agent-evals.ts \
            --url http://127.0.0.1:4351 --suite launch --network-scope company --repeat "$REPETITIONS" --timeout 360000 --junit .eve/launch.xml
          node --env-file=.eve/eval.env --import tsx scripts/run-agent-evals.ts \
            --url http://127.0.0.1:4351 --suite launch/network --network-scope personal --repeat "$REPETITIONS" --timeout 360000 --junit .eve/network-personal.xml
      - name: Upload sanitized benchmark receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zoen-native-evals-${{ github.sha }}
          path: |
            .eve/launch-*/run-*.json
            .eve/launch.xml*
            .eve/network-personal.xml*
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Remove ephemeral credentials
        if: always()
        run: rm -f .eve/eval.env "$CODEX_HOME/auth.json" "$CODEX_HOME/auth.json.seed-digest" "$CODEX_HOME/config.toml"
