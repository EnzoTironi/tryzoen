name: Zoen infrastructure

on:
  schedule:
    - cron: "47 4 * * 0"
  workflow_dispatch:
    inputs:
      operation:
        description: Infrastructure operation
        required: true
        type: choice
        options: [plan, deploy, recovery]
        default: plan

permissions:
  contents: read
  actions: read

concurrency:
  group: zoen-production-infrastructure
  cancel-in-progress: false

jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      OPERATION: ${{ github.event_name == 'schedule' && 'recovery' || inputs.operation }}
      # The CLI resolves its profile before loading --env-file.
      ALCHEMY_PROFILE: ci
      ZOEN_OPERATOR_EMAILS: ${{ secrets.ZOEN_OPERATOR_EMAILS }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir infrastructure install --frozen-lockfile
      - name: Require checks and native evaluations on this exact commit
        if: env.OPERATION == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in checks.yml zoen-agent-evals.yml; do
            conclusion=$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            test "$conclusion" = success || { echo "The latest $workflow run must pass on this exact commit before deployment."; exit 1; }
          done
      - name: Install protected deployment configuration
        env:
          ZOEN_PRODUCTION_ENV: ${{ secrets.ZOEN_PRODUCTION_ENV }}
          ZOEN_ALCHEMY_STATE: ${{ secrets.ZOEN_ALCHEMY_STATE }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { parseEnv } from 'node:util';
          if (!process.env.ZOEN_PRODUCTION_ENV || !process.env.ZOEN_ALCHEMY_STATE) throw new Error('Production configuration is missing');
          const mask = value => {
            if (typeof value === 'string' && value.length >= 8) {
              console.log('::add-mask::' + value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
              try { const nested = JSON.parse(value); if (nested && typeof nested === 'object') mask(nested); } catch {}
            } else if (value && typeof value === 'object') {
              Object.values(value).forEach(mask);
            }
          };
          mask(parseEnv(process.env.ZOEN_PRODUCTION_ENV));
          mask(process.env.ZOEN_ALCHEMY_STATE);
          const directory = join(process.env.HOME, '.alchemy');
          mkdirSync(join(directory, 'credentials', 'ci'), { recursive: true, mode: 0o700 });
          writeFileSync(join(directory, 'profiles.json'), JSON.stringify({version: 0, profiles: {ci: {Fly: {method: 'env'}, Cloudflare: {method: 'env'}}}}), {mode: 0o600});
          writeFileSync(join(directory, 'credentials', 'ci', 'cloudflare-state-store.json'), process.env.ZOEN_ALCHEMY_STATE, {mode: 0o600});
          writeFileSync('infrastructure/.env.prod', process.env.ZOEN_PRODUCTION_ENV + '\nZOEN_RELEASE=' + process.env.GITHUB_SHA + '\nZOEN_RECOVERY_RUN=ci-' + process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT + '\n', {mode: 0o600});
          JS
      - name: Check the exact source before deployment
        if: env.OPERATION == 'deploy'
        run: |
          pnpm check --concurrency=1
          pnpm --dir infrastructure types:check
          pnpm --dir infrastructure test:providers
          docker build -t zoen-postgres-proof:pg17-backup infrastructure/postgres
          bash infrastructure/postgres/test-recovery.sh
      - name: Plan infrastructure
        if: env.OPERATION != 'recovery'
        working-directory: infrastructure
        run: pnpm exec alchemy plan --stage prod --env-file "$PWD/.env.prod"
      - name: Deploy the tested release
        if: env.OPERATION == 'deploy'
        working-directory: infrastructure
        run: pnpm exec alchemy deploy --stage prod --env-file "$PWD/.env.prod" --yes
      - name: Prove recovery on an isolated temporary machine
        if: env.OPERATION != 'plan'
        working-directory: infrastructure
        run: pnpm exec alchemy deploy recovery.run.ts --stage prod --env-file "$PWD/.env.prod" --yes
      - name: Verify database backup and public service
        if: env.OPERATION != 'plan'
        run: |
          ZOEN_VAULT_PROBE_ENABLED=true pnpm --dir infrastructure check:production
          curl --fail --show-error --max-time 30 https://zoen.tironi.xyz/eve/v1/health
      - name: Remove runner credentials
        if: always()
        run: rm -f infrastructure/.env.prod "$HOME/.alchemy/credentials/ci/cloudflare-state-store.json"
