name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated infrastructure dependencies
        run: pnpm --dir infrastructure install --frozen-lockfile

      - name: Audit application and infrastructure dependencies
        run: |
          node --test scripts/audit/regressions.mjs
          node scripts/audit/run.mjs
          node scripts/audit/run.mjs --graph infrastructure

      - name: Run checks
        # Each compiler/linter/test process also uses its own CPU pool.
        run: pnpm check --concurrency=1

      - name: Verify Expo compatibility and export all shared client targets
        run: |
          pnpm --filter @zoen/mobile exec expo install --check
          pnpm --filter @zoen/mobile exec expo export --platform all --max-workers 2

      - name: List native evaluations without provider credentials
        run: node --import tsx scripts/run-agent-evals.ts --list

      - name: Check isolated infrastructure
        run: |
          pnpm --dir infrastructure peers check
          pnpm --dir infrastructure types:check
          pnpm --dir infrastructure test:providers

  desktop:
    name: Desktop package (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build an unsigned desktop package without publishing
        run: pnpm package:desktop

  runtime-shards:
    name: Runtime tests (${{ matrix.shard }}/4)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ffprobe for native audio preflight
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y ffmpeg
      - name: Create the private isolated journal fixture
        run: |
          journal_root=$(mktemp -d "${TMPDIR:-/tmp}/zoen-k3-runtime-XXXXXX")
          printf 'ZOEN_SESSION_ARCHIVE_DIR=%s\n' "$journal_root" >> "$GITHUB_ENV"
      - name: Create isolated services and verify migration idempotence
        run: |
          pnpm test:runtime:setup
          pnpm test:runtime:setup
      - name: Verify canonical claims, journal archives, PostgreSQL, Matrix and compiled Eve restart
        run: >-
          pnpm test:runtime --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=json
          --outputFile=.eve/runtime-reports/shard-${{ matrix.shard }}.json
      - name: Measure the bounded real journal fixture
        if: matrix.shard == 1
        run: pnpm test:memory:capacity --accounts 4 --sources 10 --workers 2
      - name: Build web app and agent
        if: matrix.shard == 1
        run: |
          set -a
          source tests/runtime/.env.example
          set +a
          NODE_ENV=production pnpm build --force
      - name: Start the built web app and native Eve runtime
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          node --env-file=tests/runtime/.env.example --import tsx scripts/start.ts --port 3000 > .eve/runtime-start.log 2>&1 &
          app_pid=$!
          trap 'kill -TERM "$app_pid" 2>/dev/null || true; wait "$app_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/eve/v1/health; then break; fi
            if ! kill -0 "$app_pid"; then
              tail -n 60 .eve/runtime-start.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/eve/v1/health
          # Service callbacks reach Eve and reject unsigned browser requests.
          callback_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            http://127.0.0.1:3000/internal/channel-input/respond)
          test "$callback_status" = 401
      - name: Upload runtime shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-report-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .eve/runtime-reports/shard-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Stop isolated services
        if: always()
        run: |
          status=0
          docker compose -p zoen-runtime-tests -f tests/runtime/compose.yaml down --volumes || status=$?
          if [[ "${ZOEN_SESSION_ARCHIVE_DIR:-}" == "${TMPDIR:-/tmp}"/zoen-k3-runtime-* ]]; then
            rm -rf -- "$ZOEN_SESSION_ARCHIVE_DIR"
          fi
          exit "$status"

  runtime-storage:
    name: Runtime storage and build
    if: always()
    needs: runtime-shards
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Download all runtime shard reports
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: runtime-report-*
          path: .eve/runtime-reports
      - name: Verify every shard succeeded and the complete suite passed once
        run: node scripts/verify-runtime-shards.mjs .eve/runtime-reports '${{ needs.runtime-shards.result }}' '${{ github.run_attempt }}'

  postgres-recovery:
    name: PostgreSQL backup recovery
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build the production PostgreSQL image and prove recovery
        run: |
          docker build -t zoen-postgres-proof:pg17-backup infrastructure/postgres
          bash infrastructure/postgres/test-recovery.sh
