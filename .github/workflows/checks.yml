name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated infrastructure dependencies
        run: pnpm --dir infrastructure install --frozen-lockfile

      - name: Audit application and infrastructure dependencies
        run: |
          pnpm audit --audit-level=low
          pnpm --dir infrastructure audit --audit-level=low

      - name: Run checks
        # Each compiler/linter/test process also uses its own CPU pool.
        run: pnpm check --concurrency=1

      - name: List native evaluations without provider credentials
        run: node --import tsx scripts/run-agent-evals.ts --list

      - name: Check isolated infrastructure
        run: |
          pnpm --dir infrastructure peers check
          pnpm --dir infrastructure types:check
          pnpm --dir infrastructure test:providers

  runtime-storage:
    name: Runtime storage and build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ffprobe for native audio preflight
        run: |
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y ffmpeg
      - name: Create isolated services and verify migration idempotence
        run: |
          pnpm test:runtime:setup
          pnpm test:runtime:setup
      - name: Verify PostgreSQL, Matrix and compiled Eve restart behavior
        run: pnpm test:runtime
      - name: Build web app and agent
        run: |
          set -a
          source tests/runtime/.env.example
          set +a
          NODE_ENV=production pnpm build --force
      - name: Start the built web app and native Eve runtime
        run: |
          set -euo pipefail
          node --env-file=tests/runtime/.env.example --import tsx scripts/start.ts --port 3000 > .eve/runtime-start.log 2>&1 &
          app_pid=$!
          trap 'kill -TERM "$app_pid" 2>/dev/null || true; wait "$app_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/eve/v1/health; then break; fi
            if ! kill -0 "$app_pid"; then
              tail -n 60 .eve/runtime-start.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/eve/v1/health
          # Service callbacks reach Eve and reject unsigned browser requests.
          callback_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'content-type: application/json' --data '{}' \
            http://127.0.0.1:3000/internal/channel-input/respond)
          test "$callback_status" = 401
      - name: Stop isolated services
        if: always()
        run: docker compose -p zoen-runtime-tests -f tests/runtime/compose.yaml down --volumes

  memory:
    name: Private Mem0 service
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ZOEN_MEMORY_DATABASE_URL: postgresql://zoen_memory:ci-memory-password@127.0.0.1:5432/zoen_memory
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned package manager
        run: python -m pip install uv==0.12.13
      - name: Build the production PostgreSQL image and prove recovery
        run: |
          docker build -t zoen-postgres-proof:pg17-backup infrastructure/postgres
          bash infrastructure/postgres/test-recovery.sh
      - name: Start pgvector for memory integration tests
        run: |
          docker run -d --name memory-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e ZOEN_MEMORY_DATABASE_PASSWORD=ci-memory-password \
            -e POSTGRES_DB=companion_runtime_test zoen-postgres-proof:pg17-backup
          for attempt in {1..60}; do
            if [ "$(docker inspect --format '{{.State.Running}}' memory-postgres)" != true ]; then
              docker logs memory-postgres
              exit 1
            fi
            docker exec memory-postgres pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          docker exec memory-postgres pg_isready -h 127.0.0.1 -U postgres
          docker exec memory-postgres /usr/local/bin/bootstrap-memory.sh
      - name: Verify the real memory adapter with isolated model fixtures
        working-directory: infrastructure/memory
        run: |
          uv sync --frozen
          uv run pytest
