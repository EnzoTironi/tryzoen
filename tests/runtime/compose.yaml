name: zoen-runtime-tests
services:
  postgres:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_DB: companion_runtime_test
      POSTGRES_PASSWORD: synthetic-admin
      ZOEN_APPLICATION_DATABASE_PASSWORD: synthetic-runtime
      ZOEN_MIGRATION_DATABASE_PASSWORD: synthetic-migrator
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ../../infrastructure/postgres/bootstrap-application.sh:/docker-entrypoint-initdb.d/application.sh:ro
      - ./matrix/database.sql:/docker-entrypoint-initdb.d/matrix.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U postgres -d companion_runtime_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 60
  payloads:
    image: rustfs/rustfs@sha256:42edb61d588775f9431ff436216d14392d2234d4eb2ed68321569fbf7245b36b
    environment:
      RUSTFS_ACCESS_KEY: synthetic-payload-publication
      RUSTFS_SECRET_KEY: synthetic-payload-publication-owned-fixture
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: [/data]
    ports:
      - "127.0.0.1:19480:9000"
    tmpfs:
      - /data:rw,size=256m,uid=10001,gid=10001,mode=0700
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2
  matrix:
    image: matrixdotorg/synapse:v1.160.0@sha256:78de1d10bef02e375f861d1cc99f8bedd9381d4f9083ea8b2c22a053477b205f
    user: "0:0"
    environment:
      PYTHONPATH: /zoen
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      [
        "python",
        "-m",
        "synapse.app.homeserver",
        "--config-path",
        "/config/homeserver.yaml",
      ]
    ports:
      - "127.0.0.1:18008:8008"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - matrix:/data
      - ./matrix:/config:ro
      - ../../infrastructure/matrix/registration.py:/zoen/registration.py:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions')",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
  semantic-1: &semantic
    build:
      context: ../..
      dockerfile: infrastructure/semantic/Dockerfile
    image: zoen-semantic-test
    profiles: [semantic]
    init: true
    environment:
      ZOEN_SEMANTIC_TOKEN: zoen-semantic-synthetic-test-token-0123456789
    ports:
      - "127.0.0.1:18130:18130"
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:18130/health',{headers:{authorization:'Bearer '+process.env.ZOEN_SEMANTIC_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
  semantic-2:
    <<: *semantic
    ports:
      - "127.0.0.1:18131:18130"

volumes:
  postgres:
  matrix:
